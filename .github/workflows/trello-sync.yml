name: Sincronizar Trello

# Chama /api/cron/trello de hora em hora em horário de trabalho (seg–sex, 8h–19h de
# Brasília = 11h–22h UTC). A Vercel gratuita só agenda 1x por dia (vercel.json, 6h),
# então este workflow deixa o Kanban a no máximo ~1h do Trello durante o expediente.
# Requer o segredo CRON_SECRET (mesmo valor da env var na Vercel) em
# Settings → Secrets and variables → Actions.

on:
  schedule:
    - cron: '0 11-22 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: trello-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar a sincronização
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Segredo CRON_SECRET não configurado no GitHub." >&2
            exit 1
          fi
          code=$(curl -sS -m 240 -o resposta.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://juridico.pessoaedoval.com.br/api/cron/trello)
          echo "HTTP $code"
          cat resposta.json; echo
          # 200 = sincronizou · 409 = já havia uma sincronização em andamento (ok)
          [ "$code" = "200" ] || [ "$code" = "409" ]
