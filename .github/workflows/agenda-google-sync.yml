name: Sincronizar Agenda Google

# Rede de segurança: a cada 30 min no expediente (seg–sex, 8h–19h de Brasília) chama /api/cron/agenda-google, que envia ao
# Google Agenda (pedvprazos@gmail.com) os prazos/audiências novos, atualiza os editados e apaga os excluídos no PEDV.
# Usa o mesmo segredo CRON_SECRET do workflow do Trello. Sem GOOGLE_CALENDAR_SA_JSON na Vercel, a rota só responde "desativado".

on:
  schedule:
    - cron: '*/30 11-22 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: agenda-google-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar a sincronização
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Segredo CRON_SECRET não configurado no GitHub." >&2; exit 1; fi
          code=$(curl -sS -m 120 -o resposta.json -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" https://juridico.pessoaedoval.com.br/api/cron/agenda-google)
          echo "HTTP $code"; cat resposta.json; echo
          [ "$code" = "200" ]
